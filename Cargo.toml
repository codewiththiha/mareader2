[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.0.5"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/codewiththiha/mareader2"

[workspace.dependencies]
mareader-appearance = { path = "crates/appearance" }
mareader-workspace = { path = "crates/workspace" }
mareader-settings = { path = "crates/settings" }
mareader-ui = { path = "crates/ui" }
mareader-pdf = { path = "crates/pdf" }
mareader-session = { path = "crates/session" }
mareader-reflow = { path = "crates/reflow" }
mareader-epub = { path = "crates/epub" }
mareader-library = { path = "crates/library" }
mareader-study = { path = "crates/study" }
mareader-assist = { path = "crates/assist" }
mareader-dict = { path = "crates/dict" }
mareader-fetch = { path = "crates/fetch" }
mareader-search = { path = "crates/search" }
mareader-cefr = { path = "crates/cefr" }
mareader-audio = { path = "crates/audio" }
mareader-script = { path = "crates/script" }
mareader-speech = { path = "crates/speech" }
mareader-kokoro = { path = "crates/kokoro" }
mareader-phonon = { path = "crates/phonon" }
mareader-g2p = { path = "crates/g2p" }
mareader-ipa = { path = "crates/ipa" }
mareader-hanzi = { path = "crates/hanzi" }
mareader-vits = { path = "crates/vits" }
mareader-memory = { path = "crates/memory" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
# English pronunciation: spaCy's tokenizer patterns need look-behind.
fancy-regex = "0.17"
icu_normalizer = "2"
libm = "0.2"
thiserror = "2"
# Content ids: a SHA-256 of a file's size, head and tail.
sha2 = "0.10"
tempfile = "3"
# The library store; bundled, so no system SQLite is needed.
rusqlite = { version = "0.40", default-features = false, features = ["bundled"] }
# The word dataset is a parquet; only its codecs, not arrow.
parquet = { version = "59", default-features = false, features = ["snap", "zstd"] }
# Word levels: the owner's crate, pinned; its pure modules unless asked.
cefr = { git = "https://github.com/codewiththiha/cefr-rs.git", rev = "bb2dd66c2354944f3352154d3d2b15352df0e1af", default-features = false }

# complex-scripts: dictionaries that break Thai, Lao, Khmer and Burmese lines.
parley = { version = "0.12", default-features = false, features = ["std", "system", "complex-scripts"] }
# Fontconfig loads at run time, so Linux builds need no headers.
fontique = { version = "0.12", default-features = false, features = ["fontconfig-dlopen"] }
skrifa = { version = "0.44", default-features = false, features = ["std"] }
# MathML: the math font's MATH table, glyph outlines and metrics.
ttf-parser = { version = "0.25", default-features = false, features = ["std"] }
hypher = "0.1.8"
# SVG pictures; the version egui_extras already builds.
resvg = { version = "0.45", default-features = false, features = ["text", "raster-images"] }
vello_cpu = { version = "0.3", default-features = false, features = ["std", "text", "u8_pipeline"] }
rbook = { version = "0.7.12", default-features = false, features = ["threadsafe", "write"] }
html5ever = "0.40"
# Book scripts: a pure-Rust engine, sandboxed, without Intl data.
boa_engine = { version = "0.22", default-features = false }
zip = { version = "9", default-features = false }
# Neural voices run on candle, CPU first.
candle-core = "0.9.2"
candle-nn = "0.9.2"
# The XML reader rbook uses, to measure what it would nest first.
quick-xml = { version = "0.42", default-features = false }
# Markdown and plain text become EPUBs on open.
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
encoding_rs = "0.8"
chardetng = "0.1"
# Book fonts: WOFF and WOFF2 unpacked, obfuscated fonts revealed.
flate2 = "1"
brotli-decompressor = "5"
sha1 = "0.10"

egui = "0.36"
egui_extras = { version = "0.36", default-features = false, features = ["svg"] }
eframe = { version = "0.36", default-features = false }
egui_kittest = "0.36"
egui-lucide = "0.1"
rfd = "0.17"
# Narration: pure-Rust decoders for the core audio types, and the device.
symphonia = { version = "0.6", default-features = false, features = ["mp3", "aac", "isomp4", "flac", "vorbis", "ogg", "wav", "pcm", "adpcm"] }
cpal = "0.18"
# The system's own voices; Linux reaches them through Speech Dispatcher.
tts = "0.26"
thin-vec = "0.2"
image = { version = "0.25", default-features = false, features = ["png"] }

[workspace.lints.rust]
# `deny`, not `forbid`, so one audited module can allow it; `cargo xtask
# unsafe` keeps that list to apps/mareader/src/traffic_lights.rs.
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.dev.package."*"]
opt-level = 2
debug = "line-tables-only"

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
# Symbols only name frames in backtraces, which users never see; ~3 MB.
strip = true

# Browser previews of work in progress: fast to rebuild, still optimised.
[profile.web]
inherits = "release"
lto = false
codegen-units = 16
opt-level = 2
# wasm-bindgen reads the names stripping removes.
strip = "none"
