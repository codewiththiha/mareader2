[package]
name = "mareader-assist"
description = "AI answers for the study tools: one prompt set, any provider"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
mareader-settings = { workspace = true }
mareader-study = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1.48", features = ["rt-multi-thread", "sync", "time"] }
futures-util = { version = "0.3", default-features = false }
# Apple Intelligence through a Swift helper; a Mac answers, others say why.
fm-bridge = { git = "https://github.com/codewiththiha/fm-bridge", rev = "dc85911d63d49a7946ff7d1bf12c0e226ab5a450" }
# OpenAI-compatible servers, with keys encrypted in one SQLite file.
ai-pool = { git = "https://github.com/codewiththiha/ai-pool", rev = "42f910be4828e8fe9047930a684b13320fe20cc8", default-features = false, features = ["sqlite", "os-keychain", "stream"] }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { version = "1.48", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
