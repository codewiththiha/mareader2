[package]
name = "mareader-ui"
description = "The egui front end: theme, chrome, title bar, panes and the app state (layer L7)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
mareader-appearance = { workspace = true }
mareader-workspace = { workspace = true }
mareader-settings = { workspace = true }
mareader-pdf = { workspace = true }
mareader-session = { workspace = true }
egui = { workspace = true }
egui_extras = { workspace = true }
egui-lucide = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "persistence"] }
serde = { workspace = true }
serde_json = { workspace = true }
rfd = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"

[dev-dependencies]
egui_kittest = { workspace = true, features = ["eframe", "wgpu"] }
image = { workspace = true }
