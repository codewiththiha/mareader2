[package]
name = "mareader-ui"
description = "The egui front end: theme, chrome, title bar, panes and the app state (layer L7)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
mareader-appearance = { workspace = true }
mareader-workspace = { workspace = true }
mareader-settings = { workspace = true }
mareader-epub = { workspace = true }
mareader-reflow = { workspace = true }
mareader-pdf = { workspace = true }
mareader-session = { workspace = true }
mareader-library = { workspace = true }
mareader-study = { workspace = true }
mareader-dict = { workspace = true }
mareader-cefr = { workspace = true }
mareader-search = { workspace = true }
mareader-audio = { workspace = true }
image = { workspace = true, features = ["jpeg"] }
egui = { workspace = true }
egui_extras = { workspace = true }
egui-lucide = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "persistence"] }
serde = { workspace = true }
serde_json = { workspace = true }
rfd = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "0.4"
# The system's languages, to pick subtitles in.
sys-locale = "0.3"
# AI answers and API keys; a browser has neither threads nor a keychain.
mareader-assist = { workspace = true }
# A book's scripts; the browser build shows their pages as written.
mareader-script = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"

[dev-dependencies]
egui_kittest = { workspace = true, features = ["eframe", "wgpu"] }
tempfile = { workspace = true }
parquet = { workspace = true }
