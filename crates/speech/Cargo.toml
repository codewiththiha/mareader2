[package]
name = "mareader-speech"
description = "Reading text aloud: sentences, voices, engines and voice models"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

# A browser build offers no engine yet.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tts = { workspace = true }
# Voice models come down resumable and checked.
mareader-fetch = { workspace = true }
# Kokoro and Piper: text to phonemes to samples, played as they are made.
mareader-g2p = { workspace = true }
mareader-ipa = { workspace = true }
mareader-hanzi = { workspace = true }
mareader-kokoro = { workspace = true }
mareader-vits = { workspace = true }
mareader-audio = { workspace = true }
mareader-memory = { workspace = true }

[target.'cfg(target_vendor = "apple")'.dependencies]
# The default voice comes back by the user's language: Apple's speech opens once.
sys-locale = "0.3"
# Asks which listed voices have their sound here (owner-approved unsafe).
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString"] }

[dev-dependencies]
sha2 = { workspace = true }
tempfile = { workspace = true }
