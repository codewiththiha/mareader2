[package]
name = "mareader-fetch"
description = "Resumable downloads from mirrors, checked before they are kept"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]

# A browser has no threads or files; the crate is empty there.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The TLS stack ai-pool already brings.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking"] }

[dev-dependencies]
tempfile = { workspace = true }
