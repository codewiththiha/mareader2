[package]
name = "phonon-parity"
description = "Checks mareader-phonon against Gradium's own runtime"
version = "0.0.0"
edition = "2024"
publish = false

# CI only: kept out of the app's workspace and lockfile.
[workspace]

[dependencies]
mareader-phonon = { path = "../../crates/phonon" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
debug = false
