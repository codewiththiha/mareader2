[package]
name = "kokoro-parity"
description = "Checks mareader-kokoro and mareader-g2p against the crates they port"
version = "0.0.0"
edition = "2024"
publish = false

# CI only: kept out of the app's workspace and lockfile.
[workspace]

[dependencies]
mareader-kokoro = { path = "../../crates/kokoro" }
mareader-g2p = { path = "../../crates/g2p" }
loqui-g2p = "=0.4.0"
serde_json = "1"
any-tts = { version = "=0.2.0", default-features = false, features = ["kokoro"] }
candle-core = "=0.10.2"
candle-nn = "=0.10.2"

[profile.release]
debug = false
