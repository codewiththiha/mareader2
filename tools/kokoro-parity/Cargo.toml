[package]
name = "kokoro-parity"
description = "Checks mareader-kokoro against a reference Kokoro build, stage by stage"
version = "0.0.0"
edition = "2024"
publish = false

# CI only: kept out of the app's workspace and lockfile.
[workspace]

[dependencies]
mareader-kokoro = { path = "../../crates/kokoro" }
any-tts = { version = "=0.2.0", default-features = false, features = ["kokoro"] }
candle-core = "=0.10.2"
candle-nn = "=0.10.2"

[profile.release]
debug = false
