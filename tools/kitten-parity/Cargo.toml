[package]
name = "kitten-parity"
description = "Checks mareader-kokoro on Kitten's ONNX builds against onnxruntime"
version = "0.0.0"
edition = "2024"
publish = false

# CI only: kept out of the app's workspace and lockfile.
[workspace]

[dependencies]
candle-core = "=0.9.2"
mareader-kokoro = { path = "../../crates/kokoro" }
mareader-vits = { path = "../../crates/vits" }
mareader-g2p = { path = "../../crates/g2p" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
debug = false
