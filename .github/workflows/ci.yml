name: CI

on:
  push:
    # Work branches too (AGENTS.md): CI mode proves them before main.
    branches: [main, "feat/**", "fix/**", "perf/**", "refactor/**", "docs/**",
               "test/**", "build/**", "ci/**", "chore/**"]
    # Prose only: docs/ and the top-level notes (AGENTS.md, README.md).
    paths-ignore: ["docs/**", "*.md"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Linux jobs stay on 24.04: 26.04's Mesa crashes the GPU tests at random.
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Full DWARF slowed linking the test binaries; lines still name frames.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  format:
    name: Rust / format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  lint:
    name: Rust / lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # ALSA's headers, for the narration's sound output.
      - uses: ./.github/actions/apt
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Rust / test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # lavapipe gives wgpu a software Vulkan device for kittest renders.
      - uses: ./.github/actions/apt
        with:
          packages: mesa-vulkan-drivers libasound2-dev libspeechd-dev libclang-dev
      - run: cargo test --workspace
      - run: cargo xtask layers
      - run: cargo xtask parity
      - run: cargo xtask assets
      - run: cargo xtask unsafe

  platforms:
    name: Build / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # The macOS-only modules, with and without their feature flags. Native:
      # bundled SQLite's C can't cross-compile without the macOS SDK.
      - if: runner.os == 'macOS'
        run: cargo clippy -p mareader -- -D warnings
      - if: runner.os == 'macOS'
        run: cargo clippy -p mareader --no-default-features -- -D warnings
      - run: cargo build -p mareader
      # Explorer and shortcuts read the icon from the exe (build.rs).
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/exe-icons.ps1 target/debug/mareader.exe

  commits:
    name: Build / each commit
    runs-on: ubuntu-24.04
    # Every commit builds alone, so `git bisect` never stops on a broken one.
    # Warnings are the lint job's: a split commit may briefly leave dead code.
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/apt
      - name: cargo check each new commit
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # A new branch has no "before": check what it adds to main.
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE=$(git merge-base origin/main "$HEAD")
            [ "$BASE" = "$HEAD" ] && BASE="$HEAD~1"
          fi
          for c in $(git rev-list --reverse "$BASE..$HEAD"); do
            git checkout -q "$c"
            echo "::group::$(git log -1 --format='%h %s')"
            cargo check --workspace --all-targets --locked
            echo "::endgroup::"
          done

  # A green push refreshes the sandbox cache; tools/ci.py's verdict skips it.
  refresh:
    name: Cache / sandbox
    needs: [format, lint, test, platforms, commits]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh workflow run remote.yml -R "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
          -f task=cache -f sha="$GITHUB_SHA" -f id=after-ci
