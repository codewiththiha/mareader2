name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  format:
    name: Rust / format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  lint:
    name: Rust / lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Rust / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # lavapipe gives wgpu a software Vulkan device for kittest renders.
      - run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - run: cargo test --workspace
      - run: cargo xtask layers
      - run: cargo xtask parity
      - run: cargo xtask assets
      - run: cargo xtask unsafe

  platforms:
    name: Build / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p mareader

  commits:
    name: Build / each commit
    runs-on: ubuntu-latest
    # Every commit builds alone, so `git bisect` never stops on a broken one.
    # Warnings are the lint job's: a split commit may briefly leave dead code.
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo check each new commit
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # A new branch has no "before": check its tip alone.
          git cat-file -e "$BASE^{commit}" 2>/dev/null || BASE="$HEAD~1"
          for c in $(git rev-list --reverse "$BASE..$HEAD"); do
            git checkout -q "$c"
            echo "::group::$(git log -1 --format='%h %s')"
            cargo check --workspace --all-targets --locked
            echo "::endgroup::"
          done
