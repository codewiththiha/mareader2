name: Remote
# The id lets tools/ci.py find the run it dispatched.
run-name: ${{ inputs.task }} ${{ inputs.sha }} ${{ inputs.id }}

# CI mode's on-demand jobs (docs/verification.md); none gates a merge.
on:
  workflow_dispatch:
    inputs:
      task:
        description: shots, web, memory, cache or kokoro
        required: true
        type: choice
        options: [shots, web, memory, cache, kokoro]
      sha:
        description: Commit to use (default the dispatched ref)
        default: ""
      shots:
        description: "One shot per line: NAME key=value ..."
        default: ""
      id:
        description: Request id from tools/ci.py
        default: ""
      cold:
        description: Cache from nothing, not from the last cache
        type: boolean
        default: false

permissions:
  contents: read
  # The cache job starts from the previous cache artifact.
  actions: read

env:
  CARGO_TERM_COLOR: always

jobs:
  shots:
    name: Remote / shots
    if: inputs.task == 'shots'
    runs-on: ubuntu-latest
    # The same env as CI's test job, so its cache restores here.
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
          save-if: false
      - run: sudo apt-get update -q && sudo apt-get install -y -q mesa-vulkan-drivers fonts-noto-core libasound2-dev libspeechd-dev libclang-dev
      - name: Render
        env:
          SHOTS: ${{ inputs.shots }}
        run: |
          set -f
          mkdir -p shots
          cargo build -q -p mareader-ui --example shot
          while IFS= read -r line; do
            read -r name args <<< "$line" || true
            [ -z "${name:-}" ] && continue
            case "$name" in *[!A-Za-z0-9._-]*) echo "bad name: $name"; exit 1 ;; esac
            echo "::group::$name $args"
            target/debug/examples/shot "shots/$name.png" $args
            echo "::endgroup::"
          done <<< "$SHOTS"
      - uses: actions/upload-artifact@v4
        with:
          name: shots
          path: shots/
          retention-days: 3
          if-no-files-found: error

  # docs/memory.md: each workload's table and budgets, in the summary too.
  memory:
    name: Remote / memory
    if: inputs.task == 'memory'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
          save-if: false
      # A colour emoji font, so README books draw emoji as a Mac does.
      - run: >-
          sudo apt-get update -q &&
          sudo apt-get install -y -q mesa-vulkan-drivers fonts-noto-color-emoji libasound2-dev libspeechd-dev libclang-dev
      # The M2 audit's two papers, and a long novel; a fetch may fail.
      - name: Books
        run: |
          mkdir -p books out
          get() { curl -sSfL -A "Mozilla/5.0" --retry 3 -o "books/$1" "$2" || rm -f "books/$1"; }
          get tracemonkey.pdf https://raw.githubusercontent.com/mozilla/pdf.js/master/web/compressed.tracemonkey-pldi-09.pdf
          get attention.pdf https://arxiv.org/pdf/1706.03762v7
          get war-and-peace.epub https://www.gutenberg.org/ebooks/2600.epub3.images
          cp crates/epub/tests/books/the-raven-gutenberg-17192.epub books/raven.epub
          ls -l books
      - name: Measure
        run: |
          # Without it tee hides a breached budget.
          set -o pipefail
          cargo build -q -p mareader-ui --example memory
          status=0
          run() {
            title=$1; shift
            case "$1" in books/*) [ -f "$1" ] || { echo "skipped: $title" | tee -a out/memory.md; return; } ;; esac
            printf '## %s\n\n' "$title" >> out/memory.md
            target/debug/examples/memory "$@" | tee -a out/memory.md || status=1
            echo >> out/memory.md
          }
          run "tracemonkey, 14 pp" books/tracemonkey.pdf 12
          run "arXiv Attention, 15 pp" books/attention.pdf 4
          run "The Raven, EPUB" books/raven.epub 4
          run "War and Peace, EPUB" books/war-and-peace.epub 2
          run "Markdown README of emoji, scrolled" --markdown 6
          run "Library, 3,000 PDFs read in place" --library 3000
          run "Library, 20,000 books without files" --seeded 20000
          cat out/memory.md >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - name: EPUB layout
        if: always()
        run: |
          set -o pipefail
          # One process each: run together, one test's memory counts in the other's.
          for t in set_books_hold_about_this_much markdown_drawn_again_and_again_holds_level; do
            cargo test -q -p mareader-epub --test layout_memory -- --ignored --nocapture --exact "$t" \
              | tee -a out/layout.txt
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: memory
          path: out/
          retention-days: 7

  kokoro:
    name: Remote / kokoro
    if: inputs.task == 'kokoro'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: kokoro
          workspaces: tools/kokoro-parity
      # The pinned published model and its G2P data; 350 MB, so kept.
      - uses: actions/cache@v4
        with:
          path: kokoro
          key: kokoro-f3ff3571791e39611d31c381e3a41a3af07b4987-g2p-717691a
      - name: Model
        run: |
          base=https://huggingface.co/hexgrad/Kokoro-82M/resolve/f3ff3571791e39611d31c381e3a41a3af07b4987
          mkdir -p kokoro/voices
          for f in config.json kokoro-v1_0.pth voices/af_heart.pt; do
            [ -s "kokoro/$f" ] || curl -sSfL --retry 3 -o "kokoro/$f" "$base/$f"
          done
          g2p=https://raw.githubusercontent.com/Awakened-Labs/loqui/717691aadf67408c85d87dc33e5d1d77b2ea4b4d/crates/loqui-g2p/data
          for f in spacy-en-tokenizer.json tagger-en.bin misaki-us_gold.json misaki-us_silver.json \
                   g2p-en-us.safetensors misaki-gb_gold.json misaki-gb_silver.json g2p-en-gb.safetensors; do
            [ -s "kokoro/$f" ] || curl -sSfL --retry 3 -o "kokoro/$f" "$g2p/$f"
          done
          sha256sum -c <<'SUMS'
          5abb01e2403b072bf03d04fde160443e209d7a0dad49a423be15196b9b43c17f  kokoro/config.json
          496dba118d1a58f5f3db2efc88dbdc216e0483fc89fe6e47ee1f2c53f18ad1e4  kokoro/kokoro-v1_0.pth
          0ab5709b8ffab19bfd849cd11d98f75b60af7733253ad0d67b12382a102cb4ff  kokoro/voices/af_heart.pt
          2ffa6b3b6f4da114531ff897c02f3d2551485ef45c3ca1f6e6b2fdc80e034d1d  kokoro/spacy-en-tokenizer.json
          df3d6cb2c34d7da57f92e47ae9dea6bcc9c9f8ed7cf9ceec703e84d7d67d698f  kokoro/tagger-en.bin
          dc414872a49a28ae6c141463d502fd945f3b2fde040484fdc47d00cc4612686f  kokoro/misaki-us_gold.json
          de8f67be911bb6c659187b4a65fd966b6a30e56350e0f790d763210b053ac475  kokoro/misaki-us_silver.json
          dc4a02e62d4fcb4bb4097ecf00db89b8e1a12a549a52ab6adfbba220b80a55c5  kokoro/g2p-en-us.safetensors
          29e62f4b60261c88f7f3c2c7811ca3825978948090b72d2b27d565b729282f71  kokoro/misaki-gb_gold.json
          48131e2d92ccc41655f4543e87e0f938e71463eb5a54be7f0693bb712ebb6bce  kokoro/misaki-gb_silver.json
          4994f474bb6f4584076a4e98189caaec11aa3f773a0d82d5bc263a03dd07e703  kokoro/g2p-en-gb.safetensors
          SUMS
      - name: Compare
        run: |
          set -o pipefail
          cargo run -q --release --manifest-path tools/kokoro-parity/Cargo.toml -- kokoro out
      - name: Summary
        if: always()
        run: cat out/summary.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kokoro
          path: out/
          retention-days: 7

  web:
    name: Remote / web
    if: inputs.task == 'web'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: web
      - name: wasm-bindgen, the version Cargo.lock pins
        run: |
          v=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/version = "\(.*\)"/\1/p')
          dir="wasm-bindgen-$v-x86_64-unknown-linux-musl"
          curl -sSfL "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/$v/$dir.tar.gz" \
            | tar -xz --strip-components=1 -C "$HOME/.cargo/bin" "$dir/wasm-bindgen"
      - run: OUT=web bash tools/web.sh
      - name: Screenshot in headless Chrome
        continue-on-error: true
        run: |
          python3 -m http.server -d web 8080 >/dev/null 2>&1 &
          npx -y playwright screenshot --channel chrome --viewport-size "1200, 800" \
            --wait-for-timeout 10000 http://localhost:8080/ web/preview.png
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: web/
          retention-days: 3

  cache:
    name: Remote / sandbox cache
    if: inputs.task == 'cache'
    runs-on: ubuntu-latest
    # The sandbox's paths and profile: cargo's cache is keyed on both.
    env:
      RUSTUP_HOME: /home/user/.cache/rustup
      CARGO_HOME: /home/user/.cache/cargo
      CARGO_TARGET_DIR: /home/user/.cache/target-mr
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      # The runner turns it off; cargo's default, on, is in the hash.
      CARGO_INCREMENTAL: "1"
      REPO_DIR: /home/user/mareader2
    steps:
      - name: Clone at the sandbox's path
        run: |
          sudo mkdir -p /home/user && sudo chown "$USER" /home/user
          git clone -q "https://github.com/${{ github.repository }}" "$REPO_DIR"
          git -C "$REPO_DIR" checkout -q "${{ inputs.sha || github.sha }}"
      # Only what changed since the last cache compiles: minutes, not 12.
      - name: Seed from the last cache
        if: ${{ !inputs.cold }}
        working-directory: /home/user/mareader2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/ci.py --repo "${{ github.repository }}" cache seed
      - name: Toolchain
        run: |
          if [ ! -x "$CARGO_HOME/bin/cargo" ]; then
            curl -sSf https://sh.rustup.rs | sh -s -- -y -q --no-modify-path \
              --profile minimal -c clippy,rustfmt \
              -t wasm32-unknown-unknown
          fi
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
      - name: Build what the gates build
        working-directory: /home/user/mareader2
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q libasound2-dev libspeechd-dev libclang-dev
          cargo clippy -q --workspace --all-targets -- -D warnings
          cargo clippy -q -p mareader-web --target wasm32-unknown-unknown -- -D warnings
          cargo test -q --workspace --no-run
          cargo build -q -p mareader-ui --example shot
          cargo xtask layers && cargo xtask assets && cargo xtask unsafe
      - name: Pack
        working-directory: /home/user/mareader2
        run: |
          mkdir -p /home/user/out
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          git = lambda *a: subprocess.check_output(["git", *a], text=True).strip()
          meta = {
              "sha": git("rev-parse", "HEAD"),
              "time": int(git("log", "-1", "--format=%ct")),
              "rustc": subprocess.check_output(["rustc", "-V"], text=True).strip(),
              "lock": hashlib.sha256(open("Cargo.lock", "rb").read()).hexdigest(),
              "root": "/home/user/.cache",
              "repo_dir": os.environ["REPO_DIR"],
              "dirs": ["rustup", "cargo", "target-mr"],
              # Restore gives unchanged files these times back.
              "mtimes": {f: int(os.stat(f).st_mtime)
                         for f in git("ls-files").splitlines() if os.path.isfile(f)},
          }
          json.dump(meta, open("/home/user/out/meta.json", "w"), indent=2)
          print({k: v for k, v in meta.items() if k != "mtimes"})
          PY
          du -sh /home/user/.cache/*
          tar -C /home/user/.cache --exclude=cargo/registry/cache -cf - \
            rustup cargo target-mr | zstd -q -T0 -10 -o /home/user/out/sandbox-cache.tar.zst
          ls -l /home/user/out
      - uses: actions/upload-artifact@v4
        with:
          name: sandbox-cache
          path: /home/user/out/
          compression-level: 0
          retention-days: 30
