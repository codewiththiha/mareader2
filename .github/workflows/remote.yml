name: Remote
# The id lets tools/ci.py find the run it dispatched.
run-name: ${{ inputs.task }} ${{ inputs.sha }} ${{ inputs.id }}

# CI mode's on-demand jobs (docs/verification.md); none gates a merge.
on:
  workflow_dispatch:
    inputs:
      task:
        description: shots, web, memory, cache, kokoro, piper, kitten, ipa, hanzi or system
        required: true
        type: choice
        options: [shots, web, memory, cache, kokoro, piper, kitten, ipa, hanzi, system]
      sha:
        description: Commit to use (default the dispatched ref)
        default: ""
      shots:
        description: "One shot per line: NAME key=value ..."
        default: ""
      id:
        description: Request id from tools/ci.py
        default: ""
      cold:
        description: Cache from nothing, not from the last cache
        type: boolean
        default: false

permissions:
  contents: read
  # The cache job starts from the previous cache artifact.
  actions: read

env:
  CARGO_TERM_COLOR: always

jobs:
  shots:
    name: Remote / shots
    if: inputs.task == 'shots'
    runs-on: ubuntu-latest
    # The same env as CI's test job, so its cache restores here.
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
          save-if: false
      - run: sudo apt-get update -q && sudo apt-get install -y -q mesa-vulkan-drivers fonts-noto-core libasound2-dev libspeechd-dev libclang-dev
      - name: Render
        env:
          SHOTS: ${{ inputs.shots }}
        run: |
          set -f
          mkdir -p shots
          cargo build -q -p mareader-ui --example shot
          while IFS= read -r line; do
            read -r name args <<< "$line" || true
            [ -z "${name:-}" ] && continue
            case "$name" in *[!A-Za-z0-9._-]*) echo "bad name: $name"; exit 1 ;; esac
            echo "::group::$name $args"
            target/debug/examples/shot "shots/$name.png" $args
            echo "::endgroup::"
          done <<< "$SHOTS"
      - uses: actions/upload-artifact@v4
        with:
          name: shots
          path: shots/
          retention-days: 3
          if-no-files-found: error

  # docs/memory.md: each workload's table and budgets, in the summary too.
  memory:
    name: Remote / memory
    if: inputs.task == 'memory'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
          save-if: false
      # A colour emoji font, so README books draw emoji as a Mac does.
      - run: >-
          sudo apt-get update -q &&
          sudo apt-get install -y -q mesa-vulkan-drivers fonts-noto-color-emoji libasound2-dev libspeechd-dev libclang-dev
      # The M2 audit's two papers, and a long novel; a fetch may fail.
      - name: Books
        run: |
          mkdir -p books out
          get() { curl -sSfL -A "Mozilla/5.0" --retry 3 -o "books/$1" "$2" || rm -f "books/$1"; }
          get tracemonkey.pdf https://raw.githubusercontent.com/mozilla/pdf.js/master/web/compressed.tracemonkey-pldi-09.pdf
          get attention.pdf https://arxiv.org/pdf/1706.03762v7
          get war-and-peace.epub https://www.gutenberg.org/ebooks/2600.epub3.images
          cp crates/epub/tests/books/the-raven-gutenberg-17192.epub books/raven.epub
          ls -l books
      - name: Measure
        run: |
          # Without it tee hides a breached budget.
          set -o pipefail
          cargo build -q -p mareader-ui --example memory
          status=0
          run() {
            title=$1; shift
            case "$1" in books/*) [ -f "$1" ] || { echo "skipped: $title" | tee -a out/memory.md; return; } ;; esac
            printf '## %s\n\n' "$title" >> out/memory.md
            target/debug/examples/memory "$@" | tee -a out/memory.md || status=1
            echo >> out/memory.md
          }
          run "tracemonkey, 14 pp" books/tracemonkey.pdf 12
          run "arXiv Attention, 15 pp" books/attention.pdf 4
          run "The Raven, EPUB" books/raven.epub 4
          run "War and Peace, EPUB" books/war-and-peace.epub 2
          run "Markdown README of emoji, scrolled" --markdown 6
          run "Library, 3,000 PDFs read in place" --library 3000
          run "Library, 20,000 books without files" --seeded 20000
          cat out/memory.md >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - name: EPUB layout
        if: always()
        run: |
          set -o pipefail
          # One process each: run together, one test's memory counts in the other's.
          for t in set_books_hold_about_this_much markdown_drawn_again_and_again_holds_level; do
            cargo test -q -p mareader-epub --test layout_memory -- --ignored --nocapture --exact "$t" \
              | tee -a out/layout.txt
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: memory
          path: out/
          retention-days: 7

  kokoro:
    name: Remote / kokoro
    if: inputs.task == 'kokoro'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: kokoro
          workspaces: tools/kokoro-parity
      # The pinned published model, its builds and G2P data; 650 MB, so kept.
      - uses: actions/cache@v4
        with:
          path: kokoro
          key: kokoro-f3ff3571791e39611d31c381e3a41a3af07b4987-g2p-717691a-gguf-ab19534
      - name: Model
        run: |
          base=https://huggingface.co/hexgrad/Kokoro-82M/resolve/f3ff3571791e39611d31c381e3a41a3af07b4987
          mkdir -p kokoro/voices
          for f in config.json kokoro-v1_0.pth voices/af_heart.pt; do
            [ -s "kokoro/$f" ] || curl -sSfL --retry 3 -o "kokoro/$f" "$base/$f"
          done
          g2p=https://raw.githubusercontent.com/Awakened-Labs/loqui/717691aadf67408c85d87dc33e5d1d77b2ea4b4d/crates/loqui-g2p/data
          for f in spacy-en-tokenizer.json tagger-en.bin misaki-us_gold.json misaki-us_silver.json \
                   g2p-en-us.safetensors misaki-gb_gold.json misaki-gb_silver.json g2p-en-gb.safetensors; do
            [ -s "kokoro/$f" ] || curl -sSfL --retry 3 -o "kokoro/$f" "$g2p/$f"
          done
          gguf=https://huggingface.co/cstr/kokoro-82m-GGUF/resolve/ab19534a3b5cc12bc2741478e9790eadb328654a
          for f in kokoro-82m-f16.gguf kokoro-82m-q8_0.gguf; do
            [ -s "kokoro/$f" ] || curl -sSfL --retry 3 -o "kokoro/$f" "$gguf/$f"
          done
          sha256sum -c <<'SUMS'
          5abb01e2403b072bf03d04fde160443e209d7a0dad49a423be15196b9b43c17f  kokoro/config.json
          496dba118d1a58f5f3db2efc88dbdc216e0483fc89fe6e47ee1f2c53f18ad1e4  kokoro/kokoro-v1_0.pth
          0ab5709b8ffab19bfd849cd11d98f75b60af7733253ad0d67b12382a102cb4ff  kokoro/voices/af_heart.pt
          2ffa6b3b6f4da114531ff897c02f3d2551485ef45c3ca1f6e6b2fdc80e034d1d  kokoro/spacy-en-tokenizer.json
          df3d6cb2c34d7da57f92e47ae9dea6bcc9c9f8ed7cf9ceec703e84d7d67d698f  kokoro/tagger-en.bin
          dc414872a49a28ae6c141463d502fd945f3b2fde040484fdc47d00cc4612686f  kokoro/misaki-us_gold.json
          de8f67be911bb6c659187b4a65fd966b6a30e56350e0f790d763210b053ac475  kokoro/misaki-us_silver.json
          dc4a02e62d4fcb4bb4097ecf00db89b8e1a12a549a52ab6adfbba220b80a55c5  kokoro/g2p-en-us.safetensors
          29e62f4b60261c88f7f3c2c7811ca3825978948090b72d2b27d565b729282f71  kokoro/misaki-gb_gold.json
          48131e2d92ccc41655f4543e87e0f938e71463eb5a54be7f0693bb712ebb6bce  kokoro/misaki-gb_silver.json
          4994f474bb6f4584076a4e98189caaec11aa3f773a0d82d5bc263a03dd07e703  kokoro/g2p-en-gb.safetensors
          341d5e96c2d7f06fc71dbc8d955150a5b6e3a59840f8905cb3fbe9b12120df52  kokoro/kokoro-82m-f16.gguf
          3c8b60064b287a10abd35396a59c9981675c618db8bc91bd290db63f55eb492d  kokoro/kokoro-82m-q8_0.gguf
          SUMS
      - name: Compare
        run: |
          set -o pipefail
          cargo run -q --release --manifest-path tools/kokoro-parity/Cargo.toml -- kokoro out
      # The app's own engine over the model folder, laid out as downloads leave it.
      - name: Engine
        if: always()
        run: |
          set -o pipefail
          sudo apt-get update -q && sudo apt-get install -yq libasound2-dev libspeechd-dev libclang-dev
          # A Chinese voice and the dictionaries, where downloads leave them.
          hf=https://huggingface.co/hexgrad/Kokoro-82M/resolve/f3ff3571791e39611d31c381e3a41a3af07b4987
          py=https://raw.githubusercontent.com/mozillazg/python-pinyin/df101577145af2eb1abe5656e592e34e3bb56d23/pypinyin
          jb=https://raw.githubusercontent.com/fxsjy/jieba/1e20c89b66f56c9301b0feed211733ffaa1bd72a/jieba
          mkdir -p kokoro/hanzi
          curl -sSfL --retry 3 -o kokoro/voices/zf_xiaobei.pt "$hf/voices/zf_xiaobei.pt"
          curl -sSfL --retry 3 -o kokoro/hanzi/pinyin_dict.json "$py/pinyin_dict.json"
          curl -sSfL --retry 3 -o kokoro/hanzi/phrases_dict.json "$py/phrases_dict.json"
          curl -sSfL --retry 3 -o kokoro/hanzi/dict.txt "$jb/dict.txt"
          curl -sSfL --retry 3 -o kokoro/hanzi/prob_emit.py "$jb/finalseg/prob_emit.py"
          sha256sum -c <<'SUMS'
          9b76be63dab4f4f96962030acc0126a9aee9728608fbbe115e2b58a2bd504df6  kokoro/voices/zf_xiaobei.pt
          5f294c01e6c6c0a1c8e329c79335a3f8e0b27d06bf1de7a99244b765892d1e5b  kokoro/hanzi/pinyin_dict.json
          a45ff140a6b631ca9c82127b280a2f414e0aba6bb2824a0e9d1e77fff359c665  kokoro/hanzi/phrases_dict.json
          7197c3211ddd98962b036cdf40324d1ea2bfaa12bd028e68faa70111a88e12a8  kokoro/hanzi/dict.txt
          27d46b1c9efe4dd148fde8be042a21be40e3562d0c7f1273f9de7abae12ebb8d  kokoro/hanzi/prob_emit.py
          SUMS
          MAREADER_KOKORO="$PWD/kokoro" cargo test -q --release -p mareader-speech kokoro -- --nocapture \
            | tee out/engine.txt
          { echo; echo '## Engine'; echo; grep -E 'engine( in [A-Z][a-z]+)?:' out/engine.txt; } >> out/summary.md
      - name: Summary
        if: always()
        run: cat out/summary.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kokoro
          path: out/
          retention-days: 7

  piper:
    name: Remote / piper
    if: inputs.task == 'piper'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: piper
          workspaces: tools/piper-parity
      # Six pinned voices (every quality, one multi-speaker) and the G2P data.
      - uses: actions/cache@v4
        with:
          path: piper
          key: piper-5041a7a49ae5b3a0f30e6837769eb03fdbb231bd-g2p-717691a
      - name: Voices
        run: |
          base=https://huggingface.co/rhasspy/piper-voices/resolve/5041a7a49ae5b3a0f30e6837769eb03fdbb231bd/en
          mkdir -p piper/voices piper/g2p
          for v in en_US/ljspeech/medium en_US/ljspeech/high en_US/joe/medium en_US/kathleen/low \
                   en_GB/vctk/medium en_GB/cori/medium; do
            name=$(echo "$v" | awk -F/ '{print $1"-"$2"-"$3}')
            for ext in onnx onnx.json; do
              [ -s "piper/voices/$name.$ext" ] || curl -sSfL --retry 3 -o "piper/voices/$name.$ext" "$base/$v/$name.$ext"
            done
          done
          g2p=https://raw.githubusercontent.com/Awakened-Labs/loqui/717691aadf67408c85d87dc33e5d1d77b2ea4b4d/crates/loqui-g2p/data
          for f in spacy-en-tokenizer.json tagger-en.bin misaki-us_gold.json misaki-us_silver.json \
                   g2p-en-us.safetensors misaki-gb_gold.json misaki-gb_silver.json g2p-en-gb.safetensors; do
            [ -s "piper/g2p/$f" ] || curl -sSfL --retry 3 -o "piper/g2p/$f" "$g2p/$f"
          done
          sha256sum -c <<'SUMS'
          6f52a751e2349abe7a76735eb09dc1875298c77ea2342ffd2fef79ff81b87f22  piper/voices/en_US-ljspeech-medium.onnx
          141d612cc0a95ed7efc1ca936b845c2364967f2e9217c5dbfcf69fc4d6c65860  piper/voices/en_US-ljspeech-medium.onnx.json
          5d4f08ba6a2a48c44592eed3ce56bf85e9de3dd4e20df90541ae68a8310c029a  piper/voices/en_US-ljspeech-high.onnx
          7e1f4634af596d83cca997fb7a931ba80b70f8a316a2655ee69c55365e0ace14  piper/voices/en_US-ljspeech-high.onnx.json
          58afce0321b8d9c46d7cdf9c16500cc55a793b4220212dba6b70fb788b3baf06  piper/voices/en_US-joe-medium.onnx
          3d6d5410b3795cb1950595247ef8f06190719e6fdbfa3a2356d8ec368e1aad33  piper/voices/en_US-joe-medium.onnx.json
          87adf17f5326bc0782282147a8b9788406236245f0f9b0e68dacb651bc1de8b6  piper/voices/en_US-kathleen-low.onnx
          39ebab88416edce0f63781754651788620cb97b9bb73ddf3c01f28e29a648feb  piper/voices/en_US-kathleen-low.onnx.json
          4e9fc85ab9009385319fc6bae7f55577f8a2d7ee77fd9159a5500eb6531f41e6  piper/voices/en_GB-vctk-medium.onnx
          7f85e6391ed0f7f46e4abd19345929a16be931a0c9945086f96692dce2087fa8  piper/voices/en_GB-vctk-medium.onnx.json
          1899f98e5fb8310154f3c2973f4b8a929ba7245e722b3d3a85680b833d95f10d  piper/voices/en_GB-cori-medium.onnx
          e262c16d7f192f69d4edd6b4ef8a5915379e67495fcc402f1ab15eeb33da3d36  piper/voices/en_GB-cori-medium.onnx.json
          2ffa6b3b6f4da114531ff897c02f3d2551485ef45c3ca1f6e6b2fdc80e034d1d  piper/g2p/spacy-en-tokenizer.json
          df3d6cb2c34d7da57f92e47ae9dea6bcc9c9f8ed7cf9ceec703e84d7d67d698f  piper/g2p/tagger-en.bin
          dc414872a49a28ae6c141463d502fd945f3b2fde040484fdc47d00cc4612686f  piper/g2p/misaki-us_gold.json
          de8f67be911bb6c659187b4a65fd966b6a30e56350e0f790d763210b053ac475  piper/g2p/misaki-us_silver.json
          dc4a02e62d4fcb4bb4097ecf00db89b8e1a12a549a52ab6adfbba220b80a55c5  piper/g2p/g2p-en-us.safetensors
          29e62f4b60261c88f7f3c2c7811ca3825978948090b72d2b27d565b729282f71  piper/g2p/misaki-gb_gold.json
          48131e2d92ccc41655f4543e87e0f938e71463eb5a54be7f0693bb712ebb6bce  piper/g2p/misaki-gb_silver.json
          4994f474bb6f4584076a4e98189caaec11aa3f773a0d82d5bc263a03dd07e703  piper/g2p/g2p-en-gb.safetensors
          SUMS
      - name: Compare
        run: |
          set -o pipefail
          cargo build -q --release --manifest-path tools/piper-parity/Cargo.toml
          bin=tools/piper-parity/target/release/piper-parity
          "$bin" prepare piper/voices piper/g2p out
          # espeak and onnxruntime come with piper-tts, here only, never in the app.
          python3 -m venv .ref && .ref/bin/pip install -q piper-tts==1.3.0
          .ref/bin/python tools/piper-parity/reference.py piper/voices out
          status=0
          "$bin" compare piper/voices out || status=$?
          # Speeds only compare on like hardware; runners vary.
          cpu=$(lscpu | sed -n 's/^Model name: *//p')
          printf '\nRunner: %s, %s cores.\n' "$cpu" "$(nproc)" >> out/summary.md
          exit "$status"
      # The app's own engine over voices laid out as downloads leave them.
      - name: Engine
        if: always()
        run: |
          set -o pipefail
          sudo apt-get update -q && sudo apt-get install -yq libasound2-dev libspeechd-dev libclang-dev
          for v in en_US/ljspeech/medium en_GB/cori/medium; do
            name=$(echo "$v" | awk -F/ '{print $1"-"$2"-"$3}')
            mkdir -p "model/en/$v"
            ln -sf "$PWD/piper/voices/$name.onnx" "$PWD/piper/voices/$name.onnx.json" "model/en/$v/"
          done
          ln -sf "$PWD"/piper/g2p/* model/
          MAREADER_PIPER="$PWD/model" cargo test -q --release -p mareader-speech piper -- --nocapture \
            | tee out/engine.txt
          { echo; echo '## Engine'; echo; grep 'engine' out/engine.txt; } >> out/summary.md
      - name: Summary
        if: always()
        run: cat out/summary.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: piper
          path: |
            out/summary.md
            out/cases.json
            out/wav/
          retention-days: 7

  kitten:
    name: Remote / kitten
    if: inputs.task == 'kitten'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: kitten
          workspaces: tools/kitten-parity
      # Every pinned Kitten 0.8 build and the American G2P data.
      - uses: actions/cache@v4
        with:
          path: kitten
          key: kitten-0.8-7a1db64-84781d7-1ccf72b-c027256-g2p-717691a
      - name: Builds
        run: |
          hf=https://huggingface.co/KittenML
          get() { [ -s "$3" ] || curl -sSfL --retry 3 -o "$3" "$hf/$1/resolve/$2"; }
          mkdir -p kitten/nano kitten/nano8 kitten/micro kitten/mini kitten/g2p
          get kitten-tts-nano-0.8-fp32 7a1db645b1f3ab9420761d87428e042b9cec3f26/kitten_tts_nano_v0_8.onnx kitten/nano/model.onnx
          get kitten-tts-nano-0.8-fp32 7a1db645b1f3ab9420761d87428e042b9cec3f26/voices.npz kitten/nano/voices.npz
          get kitten-tts-nano-0.8-int8 84781d74e29ee25217551556398b42f80593a813/kitten_tts_nano_v0_8.onnx kitten/nano8/model.onnx
          cp -n kitten/nano/voices.npz kitten/nano8/voices.npz
          get kitten-tts-micro-0.8 1ccf72b2c2048fd17efac7de2fab32d10e225084/kitten_tts_micro_v0_8.onnx kitten/micro/model.onnx
          get kitten-tts-micro-0.8 1ccf72b2c2048fd17efac7de2fab32d10e225084/voices.npz kitten/micro/voices.npz
          get kitten-tts-mini-0.8 c02725660cea441db4c383af69f1f26f5cd00947/kitten_tts_mini_v0_8.onnx kitten/mini/model.onnx
          get kitten-tts-mini-0.8 c02725660cea441db4c383af69f1f26f5cd00947/voices.npz kitten/mini/voices.npz
          g2p=https://raw.githubusercontent.com/Awakened-Labs/loqui/717691aadf67408c85d87dc33e5d1d77b2ea4b4d/crates/loqui-g2p/data
          for f in spacy-en-tokenizer.json tagger-en.bin misaki-us_gold.json misaki-us_silver.json g2p-en-us.safetensors; do
            [ -s "kitten/g2p/$f" ] || curl -sSfL --retry 3 -o "kitten/g2p/$f" "$g2p/$f"
          done
          sha256sum -c <<'SUMS'
          320564d2615f235de972ca27a7f39551c94185cfa24ca85b07a29084135f1e5e  kitten/nano/model.onnx
          8aa7cee235abb0739cb51e6559685f65a4dacd95568833d05699b1633f519b3f  kitten/nano/voices.npz
          f7b0afcbee92870b32b8e0276d855b954dc25470c9f051b376ac7eee537c76fc  kitten/nano8/model.onnx
          8aa7cee235abb0739cb51e6559685f65a4dacd95568833d05699b1633f519b3f  kitten/nano8/voices.npz
          95481626fee1ba70ce683e69c534fc7cb38433c46ce42d3abbeafb4b9f1a4123  kitten/micro/model.onnx
          112710c1be8ad0e967c190fb0fd95cbe5848ec4791b93209f20b28b7da20dac1  kitten/micro/voices.npz
          0f5bbae4fc4800c98dbc544a87ecfa79510de2fb8222db30d12e5bfe9177df91  kitten/mini/model.onnx
          40ad2638952b77b7b2f30127e2608e169fc69dd256b53bd8aaa3409a33193c42  kitten/mini/voices.npz
          2ffa6b3b6f4da114531ff897c02f3d2551485ef45c3ca1f6e6b2fdc80e034d1d  kitten/g2p/spacy-en-tokenizer.json
          df3d6cb2c34d7da57f92e47ae9dea6bcc9c9f8ed7cf9ceec703e84d7d67d698f  kitten/g2p/tagger-en.bin
          dc414872a49a28ae6c141463d502fd945f3b2fde040484fdc47d00cc4612686f  kitten/g2p/misaki-us_gold.json
          de8f67be911bb6c659187b4a65fd966b6a30e56350e0f790d763210b053ac475  kitten/g2p/misaki-us_silver.json
          dc4a02e62d4fcb4bb4097ecf00db89b8e1a12a549a52ab6adfbba220b80a55c5  kitten/g2p/g2p-en-us.safetensors
          SUMS
      - name: Compare
        run: |
          set -o pipefail
          cargo build -q --release --manifest-path tools/kitten-parity/Cargo.toml
          bin=tools/kitten-parity/target/release/kitten-parity
          mkdir -p builds
          for b in nano nano8 micro mini; do ln -sfn "$PWD/kitten/$b" builds/$b; done
          "$bin" prepare kitten/g2p out
          # espeak and onnxruntime run here only, never in the app.
          sudo apt-get update -q && sudo apt-get install -yq espeak-ng
          python3 -m venv .ref && .ref/bin/pip install -q onnx onnxruntime numpy phonemizer
          .ref/bin/python tools/kitten-parity/reference.py builds out
          status=0
          "$bin" compare builds out || status=$?
          # Speeds only compare on like hardware; runners vary.
          cpu=$(lscpu | sed -n 's/^Model name: *//p')
          printf '\nRunner: %s, %s cores.\n' "$cpu" "$(nproc)" >> out/summary.md
          exit "$status"
      # The app's own engine over builds laid out as downloads leave them.
      - name: Engine
        if: always()
        run: |
          set -o pipefail
          sudo apt-get update -q && sudo apt-get install -yq libasound2-dev libspeechd-dev libclang-dev
          mkdir -p model
          for b in nano micro; do
            ln -sf "$PWD/kitten/$b/model.onnx" "model/$b.onnx"
            ln -sf "$PWD/kitten/$b/voices.npz" "model/$b-voices.npz"
          done
          ln -sf "$PWD"/kitten/g2p/* model/
          MAREADER_KITTEN="$PWD/model" cargo test -q --release -p mareader-speech kitten -- --nocapture \
            | tee out/engine.txt
          { echo; echo '## Engine'; echo; grep 'engine' out/engine.txt || true; } >> out/summary.md
      - name: Summary
        if: always()
        run: cat out/summary.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kitten
          path: |
            out/summary.md
            out/cases.json
            out/wav/
          retention-days: 7

  ipa:
    name: Remote / ipa
    if: inputs.task == 'ipa'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compare
        run: |
          set -o pipefail
          # espeak-ng is the reference here only, never in the app.
          sudo apt-get update -q && sudo apt-get install -yq espeak-ng
          python3 -m venv .ref && .ref/bin/pip install -q phonemizer==3.4.0
          cargo build -q --release -p mareader-ipa --example ipa
          .ref/bin/python tools/ipa-parity/check.py target/release/examples/ipa out
      - name: Summary
        if: always()
        run: cat out/summary.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ipa
          path: out/summary.md
          retention-days: 7

  hanzi:
    name: Remote / hanzi
    if: inputs.task == 'hanzi'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compare
        run: |
          set -o pipefail
          # misaki and its Chinese tools are the reference here only.
          python3 -m venv .ref && .ref/bin/pip install -q "misaki[zh]==0.9.4" \
            jieba==0.42.1 pypinyin==0.55.0 cn2an==0.5.24
          cargo build -q --release -p mareader-hanzi --example hanzi
          .ref/bin/python tools/hanzi-parity/check.py target/release/examples/hanzi out
      - name: Summary
        if: always()
        run: cat out/summary.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hanzi
          path: out/summary.md
          retention-days: 7

  web:
    name: Remote / web
    if: inputs.task == 'web'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: web
      - name: wasm-bindgen, the version Cargo.lock pins
        run: |
          v=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/version = "\(.*\)"/\1/p')
          dir="wasm-bindgen-$v-x86_64-unknown-linux-musl"
          curl -sSfL "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/$v/$dir.tar.gz" \
            | tar -xz --strip-components=1 -C "$HOME/.cargo/bin" "$dir/wasm-bindgen"
      - run: OUT=web bash tools/web.sh
      - name: Screenshot in headless Chrome
        continue-on-error: true
        run: |
          python3 -m http.server -d web 8080 >/dev/null 2>&1 &
          npx -y playwright screenshot --channel chrome --viewport-size "1200, 800" \
            --wait-for-timeout 10000 http://localhost:8080/ web/preview.png
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: web/
          retention-days: 3

  cache:
    name: Remote / sandbox cache
    if: inputs.task == 'cache'
    runs-on: ubuntu-latest
    # The sandbox's paths and profile: cargo's cache is keyed on both.
    env:
      RUSTUP_HOME: /home/user/.cache/rustup
      CARGO_HOME: /home/user/.cache/cargo
      CARGO_TARGET_DIR: /home/user/.cache/target-mr
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      # The runner turns it off; cargo's default, on, is in the hash.
      CARGO_INCREMENTAL: "1"
      REPO_DIR: /home/user/mareader2
    steps:
      - name: Clone at the sandbox's path
        run: |
          sudo mkdir -p /home/user && sudo chown "$USER" /home/user
          git clone -q "https://github.com/${{ github.repository }}" "$REPO_DIR"
          git -C "$REPO_DIR" checkout -q "${{ inputs.sha || github.sha }}"
      # Only what changed since the last cache compiles: minutes, not 12.
      - name: Seed from the last cache
        if: ${{ !inputs.cold }}
        working-directory: /home/user/mareader2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/ci.py --repo "${{ github.repository }}" cache seed
      - name: Toolchain
        run: |
          if [ ! -x "$CARGO_HOME/bin/cargo" ]; then
            curl -sSf https://sh.rustup.rs | sh -s -- -y -q --no-modify-path \
              --profile minimal -c clippy,rustfmt \
              -t wasm32-unknown-unknown
          fi
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
      - name: Build what the gates build
        working-directory: /home/user/mareader2
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q libasound2-dev libspeechd-dev libclang-dev
          cargo clippy -q --workspace --all-targets -- -D warnings
          cargo clippy -q -p mareader-web --target wasm32-unknown-unknown -- -D warnings
          cargo test -q --workspace --no-run
          cargo build -q -p mareader-ui --example shot
          cargo xtask layers && cargo xtask assets && cargo xtask unsafe
      - name: Pack
        working-directory: /home/user/mareader2
        run: |
          mkdir -p /home/user/out
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          git = lambda *a: subprocess.check_output(["git", *a], text=True).strip()
          meta = {
              "sha": git("rev-parse", "HEAD"),
              "time": int(git("log", "-1", "--format=%ct")),
              "rustc": subprocess.check_output(["rustc", "-V"], text=True).strip(),
              "lock": hashlib.sha256(open("Cargo.lock", "rb").read()).hexdigest(),
              "root": "/home/user/.cache",
              "repo_dir": os.environ["REPO_DIR"],
              "dirs": ["rustup", "cargo", "target-mr"],
              # Restore gives unchanged files these times back.
              "mtimes": {f: int(os.stat(f).st_mtime)
                         for f in git("ls-files").splitlines() if os.path.isfile(f)},
          }
          json.dump(meta, open("/home/user/out/meta.json", "w"), indent=2)
          print({k: v for k, v in meta.items() if k != "mtimes"})
          PY
          du -sh /home/user/.cache/*
          tar -C /home/user/.cache --exclude=cargo/registry/cache -cf - \
            rustup cargo target-mr | zstd -q -T0 -10 -o /home/user/out/sandbox-cache.tar.zst
          ls -l /home/user/out
      - uses: actions/upload-artifact@v4
        with:
          name: sandbox-cache
          path: /home/user/out/
          compression-level: 0
          retention-days: 30

  # The system's own voices, where they run: opened again, and side by side.
  system:
    name: Remote / system ${{ matrix.os }}
    if: inputs.task == 'system'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: system
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          mkdir -p out
          cargo test -q -p mareader-speech --lib system:: -- --nocapture 2>&1 \
            | tee "out/${{ matrix.os }}.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: system-${{ matrix.os }}
          path: out/
          retention-days: 7

  system-report:
    name: Remote / system report
    if: always() && inputs.task == 'system'
    needs: system
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: system-*
          merge-multiple: true
          path: out
      - name: Summary
        run: |
          mkdir -p report
          {
            echo '# System voices'
            for os in macos-latest windows-latest; do
              log="out/$os.txt"
              verdict=FAIL
              grep -q 'test result: ok' "$log" 2>/dev/null && verdict=pass
              echo; echo "## $os: $verdict"; echo; echo '```'
              grep -E 'system voices|panicked|Operation|test result|^error' "$log" 2>/dev/null | head -20
              echo '```'
            done
            passed=$(grep -l 'test result: ok' out/*.txt 2>/dev/null | wc -l)
            [ "$passed" -eq 2 ] && { echo; echo '**All checks pass.**'; }
            true
          } > report/summary.md
          cat report/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: system
          path: report/summary.md
          retention-days: 7
