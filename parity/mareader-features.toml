title = "Closing the last pane on a book releases its textures, jobs and document (measured)"
area = "L"
tier = "P0"
milestone = "M2"
status = "shipped"
reference = ["crates/reader-runtime/src/services/document/close.rs"]
evidence = [
    "crates/ui/tests/reading.rs::closing_the_last_pane_on_a_book_frees_its_textures",
]
notes = "Documents, rasters, text layers and jobs reach zero on close; RSS levels off over twelve open, read and close rounds (docs/memory.md, 2026-10-13)"

[[feature]]
id = "perf.caches-capped"
title = "Tile cache capped by bytes, thumbnails LRU of 16"
area = "L"
tier = "P0"
milestone = "M2"
status = "shipped"
reference = ["crates/reader-runtime/src/components/shell/sidebar/panels/thumbnails"]
evidence = [
    "crates/ui/src/pages.rs::the_cap_evicts_cold_pages_but_never_visible_ones",
    "crates/ui/src/pages.rs::tiles_share_the_byte_cap_and_go_cold_first",
    "crates/ui/src/pages.rs::a_page_drawn_at_another_scale_drops_its_old_tiles",
    "crates/session/src/tests.rs::finished_pages_wait_in_a_bounded_queue",
]
notes = "One 256 MiB byte cap holds pages, tiles and thumbnails (ADR 0006 replaced the LRU of 16); finished results wait at 32 items or 32 MiB"

[[feature]]
id = "perf.stale-results"
title = "Results for a closed pane, an old zoom or an old document are dropped"
area = "L"
tier = "P0"
milestone = "M2"
status = "shipped"
reference = ["crates/reader-runtime/src/services/document/session.rs"]
evidence = ["crates/session/src/tests.rs::only_the_latest_demand_is_drawn", "crates/session/src/tests.rs::closing_drops_the_document_and_its_late_pages"]
notes = "The pool keeps only the latest demand: unwanted jobs and late results are dropped, as are pages of closed documents"

[[feature]]
id = "perf.shared-documents"
title = "A book open in several panes is parsed once and shares one tile cache (ADR 0006)"
area = "L"
tier = "P1"
milestone = "M3"
status = "shipped"
evidence = ["crates/ui/tests/reading.rs::one_file_in_two_panes_is_read_once_and_drawn_once"]
notes = "Improves on mareader, where each pane's iframe loads its own copy"

[[feature]]
