# mareader2 parity with mareader. Validated and reported by `cargo xtask parity`.
# Parity is functional (ADR 0005): a title names what the user can do, not how mareader drew it.
# status: planned | partial (notes say what is missing) | shipped (evidence cites a test) | dropped (notes say why)
# evidence: `path::test_fn` in this repo. reference: paths in the ../mareader checkout.
# areas: A chrome, B workspace, C library, D pdf, E epub, F appearance, G typography,
#        H navigation and search, I study, J settings, K motion/keys/a11y, L performance.

