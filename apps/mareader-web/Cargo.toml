[package]
name = "mareader-web"
description = "Mareader in the browser: a live preview of work in progress (egui, WebGPU or WebGL)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
mareader-ui = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "persistence"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["console", "Document", "HtmlCanvasElement", "Location", "Window"] }
