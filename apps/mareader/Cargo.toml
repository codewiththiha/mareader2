[package]
name = "mareader"
description = "Mareader, the desktop reader (egui)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
mareader-ui = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "persistence", "wayland", "x11", "links"] }
egui = { workspace = true }

[features]
default = ["traffic-lights", "open-files"]
# macOS: centre the traffic lights in the bar and fade them with it. This is
# one of two `unsafe` modules (AppKit calls); off keeps AppKit's position.
traffic-lights = ["dep:objc2", "dep:objc2-app-kit", "dep:objc2-foundation", "dep:raw-window-handle"]

# macOS: files opened from Finder or the Dock (an AppKit Apple event
# handler, so `unsafe`); off, only the command line opens files.
open-files = [
    "dep:objc2",
    "objc2-app-kit/NSApplication",
    "objc2-foundation/NSAppleEventDescriptor",
    "objc2-foundation/NSAppleEventManager",
    "objc2-foundation/NSNotification",
    "objc2-foundation/NSString",
    "objc2-foundation/NSURL",
]

# The versions eframe already uses on macOS, so nothing new is built.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6.4", optional = true }
objc2-app-kit = { version = "0.3.2", optional = true, default-features = false, features = ["std", "NSButton", "NSControl", "NSResponder", "NSView", "NSWindow", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3.2", optional = true, default-features = false, features = ["std", "NSGeometry", "objc2-core-foundation"] }
raw-window-handle = { version = "0.6", optional = true }

# Installers that open Mareader's books: `cargo packager --release`.
# See docs/packaging.md.
[package.metadata.packager]
product-name = "Mareader"
identifier = "com.codewiththiha.mareader"
authors = ["codewiththiha <codewiththiha@users.noreply.github.com>"]
category = "Productivity"
before-packaging-command = "cargo build --release -p mareader"
# The Apple Intelligence helper, when tools/fm-helper.sh built it.
resources = ["helper/FMBridge"]
icons = [
    "icons/32x32.png",
    "icons/128x128.png",
    "icons/128x128@2x.png",
    "icons/icon.icns",
    "icons/icon.ico",
]

[[package.metadata.packager.file-associations]]
extensions = ["pdf"]
name = "PDF Document"
description = "PDF document"
mime-type = "application/pdf"
role = "viewer"

[[package.metadata.packager.file-associations]]
extensions = ["epub"]
name = "EPUB Book"
description = "EPUB electronic book"
mime-type = "application/epub+zip"
role = "viewer"

# Text and Markdown open as EPUBs; mareader registered both.
[[package.metadata.packager.file-associations]]
extensions = ["txt", "text"]
name = "Text Document"
description = "Plain text document"
mime-type = "text/plain"
role = "viewer"

[[package.metadata.packager.file-associations]]
extensions = ["md", "markdown", "mdown"]
name = "Markdown Document"
description = "Markdown document"
mime-type = "text/markdown"
role = "viewer"

[package.metadata.packager.macos]
minimum-system-version = "11.0"
# Ad hoc: Gatekeeper asks once. CI swaps in a Developer ID when it has one.
signing-identity = "-"

# Loaded at run time, so dpkg can't see them: fonts, keyboard, GPU.
[package.metadata.packager.deb]
depends = ["libfontconfig1", "libxkbcommon0", "libxkbcommon-x11-0", "libvulkan1 | libegl1"]

# The same for Arch; libglvnd gives EGL where Vulkan is missing.
[package.metadata.packager.pacman]
depends = ["fontconfig", "libxkbcommon", "libxkbcommon-x11", "libglvnd"]
