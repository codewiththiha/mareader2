[package]
name = "mareader"
description = "Mareader, the desktop reader (egui)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
mareader-ui = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "persistence", "wayland", "x11", "links"] }
egui = { workspace = true }

[features]
default = ["traffic-lights", "open-files"]
# macOS: centre the traffic lights in the bar and fade them with it. This is
# one of two `unsafe` modules (AppKit calls); off keeps AppKit's position.
traffic-lights = ["dep:objc2", "dep:objc2-app-kit", "dep:objc2-foundation", "dep:raw-window-handle"]

# macOS: files opened from Finder or the Dock (an AppKit Apple event
# handler, so `unsafe`); off, only the command line opens files.
open-files = [
    "dep:objc2",
    "objc2-app-kit/NSApplication",
    "objc2-foundation/NSAppleEventDescriptor",
    "objc2-foundation/NSAppleEventManager",
    "objc2-foundation/NSNotification",
    "objc2-foundation/NSString",
    "objc2-foundation/NSURL",
]

# The versions eframe already uses on macOS, so nothing new is built.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6.4", optional = true }
objc2-app-kit = { version = "0.3.2", optional = true, default-features = false, features = ["std", "NSButton", "NSControl", "NSResponder", "NSView", "NSWindow", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3.2", optional = true, default-features = false, features = ["std", "NSGeometry", "objc2-core-foundation"] }
raw-window-handle = { version = "0.6", optional = true }
